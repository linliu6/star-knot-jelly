{
  "name": "Publish Jelly Play web, VR and MR",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "star-knot-pages.zip",
        "jelly-vr-pages.zip",
        "jelly-mr-pages.zip",
        ".github/workflows/pages.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "pages": "write",
    "id-token": "write"
  },
  "concurrency": {
    "group": "pages",
    "cancel-in-progress": false
  },
  "jobs": {
    "deploy": {
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/configure-pages@v5"
        },
        {
          "name": "Unpack preserved web and VR plus independent MR",
          "run": "unzip -q star-knot-pages.zip -d _site\nunzip -q jelly-vr-pages.zip -d _site/vr\nunzip -q jelly-mr-pages.zip -d _site/mr"
        },
        {
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "path": "_site"
          }
        },
        {
          "name": "Publish website",
          "id": "deployment",
          "uses": "actions/deploy-pages@v4"
        }
      ]
    }
  }
}